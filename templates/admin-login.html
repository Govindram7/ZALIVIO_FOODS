<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Zalivio Foods</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}?v=1"
    >

</head>

<body class="admin-login-body">

    <main class="login-page">

        <section class="login-card">

            <div class="admin-brand">
                ZALIVIO FOODS
            </div>

            <span class="admin-label">
                ADMIN PORTAL
            </span>

            <h1>
                Welcome Back
            </h1>

            <p class="login-description">
                Sign in to manage customer orders.
            </p>


            {% if error %}

                <div class="admin-message error">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="{{ url_for('admin_login') }}"
            >

                <div class="admin-form-group">

                    <label for="password">
                        Admin Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autofocus
                    >

                </div>


                <button
                    type="submit"
                    class="admin-primary-button"
                >
                    Sign In
                </button>

            </form>


            <a
                href="{{ url_for('home') }}"
                class="back-store-link"
            >
                ← Back to Store
            </a>

        </section>

    </main>

</body>

</html>
